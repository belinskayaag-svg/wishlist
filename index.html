<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Виш-лист</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F4F4;
    --ink:#101010;
    --muted:#6b6d72;
    --card:#e9e9e9;
    --accent:#0038FF;
    --frame:1.5px solid var(--ink);
    --pad:16px;
    --side-w:240px;
    --sans:"Roboto Flex",Arial,sans-serif;
    --serif:"Fraunces",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-variation-settings:"wdth" 100,"wght" 420;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit}

  /* ================= левое меню в рамке ================= */
  aside{
    position:fixed;top:var(--pad);left:var(--pad);bottom:var(--pad);width:var(--side-w);
    border:var(--frame);display:flex;flex-direction:column;background:var(--bg);z-index:5
  }
  aside > section{border-bottom:var(--frame)}
  aside > section:last-child{border-bottom:0}

  .logo{
    height:140px;flex:none;display:flex;align-items:center;justify-content:center;
    text-transform:uppercase;font-size:15px;letter-spacing:.02em;
    font-variation-settings:"wdth" 100,"wght" 420
  }

  .menu,.box{flex:1 1 0;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .menu,.box{padding:16px}
  .item{
    appearance:none;background:none;border:0;padding:3px 0;cursor:pointer;
    text-transform:uppercase;font-size:15px;letter-spacing:.02em;line-height:1.3;
    font-variation-settings:"wdth" 100,"wght" 420;transition:font-variation-settings .25s,color .2s;
    display:inline-flex;gap:6px;align-items:baseline;text-align:left
  }
  .item sup{font-size:10px;color:var(--muted);font-variation-settings:"wdth" 100,"wght" 420}
  .item:hover{font-variation-settings:"wdth" 100,"wght" 680}
  .item[aria-pressed="true"]{color:var(--accent);font-variation-settings:"wdth" 100,"wght" 680}
  .item[aria-pressed="true"] sup{color:var(--accent)}
  .item:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .box > .opts{display:flex;flex-direction:column;align-items:center}

  .foot{flex:none;padding:16px;text-align:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .login{appearance:none;background:none;border:0;padding:0;margin-left:8px;cursor:pointer;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;transition:color .2s}
  .login:hover{color:var(--accent)}
  .login:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .err{color:#c62828}

  /* ================= карточки справа ================= */
  main{margin-left:calc(var(--side-w) + var(--pad)*2);padding:var(--pad) var(--pad) 80px 8px}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px 16px}

  .card{display:block;min-width:0;text-decoration:none;position:relative;animation:in .5s both}
  @keyframes in{from{opacity:0;transform:translateY(14px)}}
  .ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--card)}
  .ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
  .card:hover .ph img{transform:scale(1.035)}
  .cap{padding-top:12px;text-transform:uppercase;font-size:15px;line-height:1.35;letter-spacing:.02em}
  .cap .t{display:block;color:var(--muted);font-size:13px;margin-bottom:4px;transition:color .2s}
  .cap .p{display:block}
  .cap .l{display:inline-block;margin-top:2px;transition:color .2s}
  .cap .nw{white-space:nowrap}
  .cap .l svg{display:inline-block;width:11px;height:11px;margin-left:4px;vertical-align:-1px;transition:transform .25s}
  .card:hover .l{color:var(--accent)}
  .card:hover .l svg{transform:translate(2px,-2px)}

  .del{
    position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;padding:0;
    background:rgba(255,255,255,.92);color:var(--ink);cursor:pointer;display:grid;place-items:center;
    opacity:0;transform:scale(.85);transition:opacity .2s,transform .2s,background .2s,color .2s;z-index:2
  }
  .del svg{width:12px;height:12px}
  .card:hover .del,.del:focus-visible{opacity:1;transform:none}
  .del:hover{background:var(--ink);color:#fff}
  @media (hover:none){.del{opacity:.9;transform:none}}

  /* карточка «добавить желание» */
  .add{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%;align-self:start;font:inherit}
  .add .ph{border:var(--frame);background:transparent;display:grid;place-items:center;transition:background .25s}
  .add .plus{position:relative;width:64px;height:64px;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
  .add .plus::before,.add .plus::after{content:"";position:absolute;background:var(--ink);transition:background .25s}
  .add .plus::before{left:50%;top:0;bottom:0;width:2px;margin-left:-1px}
  .add .plus::after{top:50%;left:0;right:0;height:2px;margin-top:-1px}
  .add:hover .ph{background:var(--accent)}
  .add:hover .plus{transform:rotate(90deg)}
  .add:hover .plus::before,.add:hover .plus::after{background:#fff}
  .add:hover .p{color:var(--accent)}
  .add:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

  .empty{grid-column:2 / -1;align-self:center;font-family:var(--serif);font-style:italic;font-size:28px;color:var(--muted)}

  /* ================= форма ================= */
  dialog{
    border:var(--frame);border-radius:0;padding:0;width:min(520px,calc(100vw - 32px));
    background:var(--bg);color:var(--ink)
  }
  dialog::backdrop{background:rgba(16,16,16,.35);backdrop-filter:blur(3px)}
  .dhead{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:var(--frame)}
  .dhead h2{margin:0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:30px;font-variation-settings:"opsz" 72,"wght" 380}
  .x{appearance:none;background:none;border:0;font-size:26px;cursor:pointer;line-height:1}
  form{padding:20px;display:grid;gap:14px}
  label{display:grid;gap:6px;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  input,select{
    font:inherit;font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink);
    border:0;border-bottom:var(--frame);background:transparent;padding:6px 0;border-radius:0
  }
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .more{display:none;gap:14px}
  .more.on{display:grid}
  .status{margin:-6px 0 0;font-size:13px;color:var(--muted);min-height:1em}
  .status:empty{display:none}
  .photo{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:end}
  .drop{display:block;cursor:pointer;text-transform:none}
  .preview{
    width:96px;aspect-ratio:4/5;display:grid;place-items:center;
    background:transparent center/cover no-repeat;border:1.5px dashed #b9b9b9;transition:border-color .2s,background-color .2s
  }
  .preview:empty:not(.has)::after{content:"+";font-size:28px;font-weight:300;color:#9a9a9a}
  .preview.has{border-style:solid;border-color:transparent}
  .preview.need{border-color:var(--accent)}
  .preview.need:not(.has)::after{color:var(--accent)}
  .drop:hover .preview:not(.has){border-color:var(--ink)}
  dialog.dragging .preview{border-color:var(--accent);background-color:rgba(0,56,255,.06)}
  .phint{margin:0;font-size:13px;line-height:1.4;color:var(--muted);align-self:center}
  kbd{font:inherit;font-size:12px;border:1px solid #cfcfcf;border-radius:4px;padding:0 4px;color:var(--ink)}

  /* уведомление «удалено — вернуть» */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:20;
    display:flex;align-items:center;gap:18px;background:var(--ink);color:var(--bg);padding:12px 18px;
    font-size:14px;transition:opacity .25s,transform .25s;max-width:calc(100vw - 32px)
  }
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast button{appearance:none;border:0;background:none;color:#fff;cursor:pointer;padding:0;text-transform:uppercase;letter-spacing:.03em;font-size:13px;border-bottom:1px solid currentColor;flex:none}
  .toast button:hover{color:#9db2ff}
  .want{display:flex;gap:6px}
  .want input{position:absolute;opacity:0;pointer-events:none}
  .want span{width:34px;height:34px;border:var(--frame);display:grid;place-items:center;font-size:14px;color:var(--ink);cursor:pointer;transition:background .15s,color .15s}
  .want input:checked + span{background:var(--accent);border-color:var(--accent);color:#fff}
  .want input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
  .submit{
    appearance:none;border:0;background:var(--ink);color:var(--bg);padding:14px;margin-top:6px;cursor:pointer;
    text-transform:uppercase;letter-spacing:.04em;font-size:14px;font-variation-settings:"wdth" 100,"wght" 600;transition:background .2s
  }
  .submit:hover{background:var(--accent)}
  .note{margin:0;font-size:12px;color:var(--muted)}

  /* ================= адаптив ================= */
  @media (max-width:1280px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.empty{grid-column:1 / -1}}
  @media (max-width:760px){
    aside{position:static;margin:var(--pad);width:auto}
    .menu{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:2px 16px;padding:18px 12px}
    .logo{height:90px}
    .menu,.box{flex:none;overflow:visible}
    .box > .opts{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:2px 14px}
    main{margin-left:0;padding:0 var(--pad) 60px}
    .grid{gap:40px 10px}
    .cap{font-size:13px}.cap .t{font-size:11px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<aside>
  <section class="logo"><h1 style="margin:0;font:inherit">Wishlist</h1></section>

  <section class="menu" id="cats" role="group" aria-label="Категории"></section>

  <section class="box">
    <div class="opts" role="group" aria-label="Порядок">
      <button class="item" data-sort="want" aria-pressed="true">самое желанное</button>
      <button class="item" data-sort="asc" aria-pressed="false">сначала дешёвое</button>
      <button class="item" data-sort="desc" aria-pressed="false">сначала дорогое</button>
      <button class="item" data-sort="new" aria-pressed="false">новое</button>
    </div>
  </section>

  <section class="box">
    <div class="opts" role="group" aria-label="Цена">
      <button class="item" data-price="all" aria-pressed="true">любая</button>
      <button class="item" data-price="3000" aria-pressed="false">до 3 000 ₽</button>
      <button class="item" data-price="10000" aria-pressed="false">до 10 000 ₽</button>
      <button class="item" data-price="more" aria-pressed="false">от 10 000 ₽</button>
    </div>
  </section>

  <section class="foot"><span id="updated">обновлено …</span><button class="login" type="button" id="loginBtn" hidden>· войти</button></section>
</aside>

<main>
  <div class="grid" id="grid"></div>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dhead">
    <h2 id="dlgTitle">Новое желание</h2>
    <button class="x" type="button" aria-label="Закрыть" data-close>×</button>
  </div>
  <form id="addForm" method="dialog">
    <label>Ссылка на вещь<input id="fUrl" type="url" required placeholder="Вставь ссылку с Wildberries, Ozon, Lamoda…"></label>
    <p class="status" id="fStatus" aria-live="polite"></p>
    <div class="more" id="fMore">
      <div class="photo">
        <label class="drop" title="Выбрать фото">
          <span class="preview" id="preview"></span>
          <input type="file" id="fFile" accept="image/*" hidden>
        </label>
        <p class="phint">Фото: вставь скриншот <kbd>⌘V</kbd>, перетащи картинку в&nbsp;окно или нажми на&nbsp;квадрат.</p>
      </div>
      <label>Что это<input id="fTitle" required placeholder="Например, льняная рубашка"></label>
      <div class="row">
        <label>Цена, ₽<input id="fPrice" type="number" min="0" step="1" required placeholder="2500"></label>
        <label>Категория<select id="fCat"></select></label>
      </div>
      <label>Насколько хочу
        <div class="want" id="fWant"></div>
      </label>
      <button class="submit" type="submit">Добавить в виш-лист</button>
      <p class="note">Желание сразу увидят все, у кого есть ссылка на виш-лист.</p>
    </div>
  </form>
</dialog>

<dialog id="loginDlg" aria-labelledby="loginTitle">
  <div class="dhead">
    <h2 id="loginTitle">Вход</h2>
    <button class="x" type="button" aria-label="Закрыть" data-close-login>×</button>
  </div>
  <form id="loginForm">
    <label>Пароль<input id="lPass" type="password" autocomplete="current-password" required></label>
    <p class="status" id="lStatus" aria-live="polite"></p>
    <button class="submit" type="submit">Войти</button>
    <p class="note">Войти может только хозяйка виш-листа — после входа можно добавлять и удалять желания.</p>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="undo">Вернуть</button></div>

<script>
/* ===== Список желаний берётся с сервера (GET /api/items) =====
   Добавлять и удалять может только хозяйка после входа по паролю. */
const $=id=>document.getElementById(id);
let items=[], owner=false, canLogin=false;
const all=()=>items;

async function api(path,opt={}){
  const r=await fetch(path,{credentials:'same-origin',...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.error||('Ошибка '+r.status)),{status:r.status});
  return j;
}
const fmtDate=t=>new Date(t).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'});
async function loadItems(){
  try{
    const d=await api('/api/items');
    items=d.items; owner=d.owner; canLogin=d.canLogin;
    $('updated').textContent='обновлено '+fmtDate(d.updated);
  }catch{
    $('updated').textContent='не получилось загрузить список';
  }
  const lb=$('loginBtn');
  lb.hidden=!(owner||canLogin);
  lb.textContent=owner?'· выйти':'· войти';
  render();
}

/* ===== магазин по ссылке ===== */
const SHOPS={wildberries:'Wildberries',lamoda:'Lamoda',ozon:'Ozon',goldapple:'Золотое яблоко','12storeez':'12 Storeez',letu:'Летуаль',zarahome:'Zara Home',market:'Яндекс Маркет'};
function shopName(url){
  try{
    const h=new URL(url).hostname.replace(/^www\./,'');
    if(/ikonika/i.test(url)) return 'Ikonika';
    for(const k in SHOPS) if(h.includes(k)) return SHOPS[k];
    return h;
  }catch{return ''}
}

/* ===== меню ===== */
const CATS=['одежда','сумки и обувь','красота','дом','аксессуары'];
const state={cat:'все',sort:'want',price:'all'};
const catsEl=document.getElementById('cats');
function renderCats(){
  const list=all();
  catsEl.innerHTML=['все',...CATS].map(c=>{
    const n=c==='все'?list.length:list.filter(i=>i.cat===c).length;
    return `<button class="item" data-cat="${c}" aria-pressed="${state.cat===c}">${c}<sup>${n}</sup></button>`;
  }).join('');
}
document.querySelector('aside').addEventListener('click',e=>{
  const b=e.target.closest('.item'); if(!b) return;
  const key=Object.keys(b.dataset)[0];
  state[key]=b.dataset[key];
  b.parentElement.querySelectorAll('.item').forEach(x=>x.setAttribute('aria-pressed',x===b));
  render();
});

/* ===== карточки ===== */
const CROSS='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>';
const ARROW='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3.5 8.5l5-5M4.5 3.5h4v4"/></svg>';
const fmt=n=>Number(n).toLocaleString('ru-RU').replace(/ /g,' ')+' ₽';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){
  let list=all().filter(i=>
    (state.cat==='все'||i.cat===state.cat) &&
    (state.price==='all'||(state.price==='more'?i.price>=10000:i.price<=+state.price))
  );
  const by={
    want:(a,b)=>b.want-a.want||a.price-b.price,
    asc:(a,b)=>a.price-b.price,
    desc:(a,b)=>b.price-a.price,
    new:(a,b)=>(b.added||0)-(a.added||0)||a.order-b.order,
  };
  list.sort(by[state.sort]);

  const addCard=`
    <button class="card add" type="button" id="addBtn">
      <div class="ph"><span class="plus" aria-hidden="true"></span></div>
      <div class="cap"><span class="t">&nbsp;</span><span class="p">Добавить новое желание</span></div>
    </button>`;
  const cards=list.map((i,n)=>{
    const shop=shopName(i.url);
    return `
    <a class="card" href="${esc(i.url)}" target="_blank" rel="noopener" style="animation-delay:${Math.min(n+1,12)*40}ms">
      <div class="ph"><img src="${esc(i.img)}" alt="${esc(i.title)}" loading="lazy"></div>
      <div class="cap">
        <span class="t">${esc(i.title)}</span>
        <span class="p">${fmt(i.price)}</span>
        <span class="l">${(shop?'ссылка на '+esc(shop):'ссылка').replace(/(\S+)$/,'<span class="nw">$1'+ARROW+'</span>')}</span>
      </div>
      ${owner?`<button class="del" type="button" data-del="${i.id}" aria-label="Удалить «${esc(i.title)}»" title="Удалить">${CROSS}</button>`:''}
    </a>`}).join('');
  document.getElementById('grid').innerHTML=(owner?addCard:'')+(cards||`<div class="empty">Тут пусто — попробуй другой фильтр</div>`);
  renderCats();
}

/* ===== удаление с возможностью вернуть ===== */
const toast=$('toast'), toastMsg=$('toastMsg');
let undoFn=null, toastTimer;
function showToast(msg,undo){
  toastMsg.textContent=msg; undoFn=undo; $('undo').hidden=!undo; toast.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{toast.classList.remove('on');undoFn=null},6000);
}
$('undo').onclick=()=>{if(undoFn) undoFn(); undoFn=null; toast.classList.remove('on')};

async function removeItem(id){
  const item=items.find(i=>i.id===id); if(!item) return;
  items=items.filter(i=>i.id!==id); render();
  try{
    await api('/api/items/'+id,{method:'DELETE'});
    showToast(`Удалено: ${item.title}`,async()=>{
      await api(`/api/items/${id}/restore`,{method:'POST'}).catch(()=>{});
      loadItems();
    });
  }catch(e){
    showToast(e.status===401?'Нужно войти заново':'Не получилось удалить',null);
    loadItems();
  }
}

document.getElementById('grid').addEventListener('click',e=>{
  const del=e.target.closest('[data-del]');
  if(del){
    e.preventDefault(); e.stopPropagation();
    removeItem(del.dataset.del);
    return;
  }
  if(e.target.closest('#addBtn')) openForm();
});

/* ===== форма «новое желание» ===== */
const dlg=document.getElementById('dlg'), form=document.getElementById('addForm');
const fUrl=$('fUrl'), fTitle=$('fTitle'), fPrice=$('fPrice'), fCat=$('fCat'), fFile=$('fFile'), fMore=$('fMore'), fStatus=$('fStatus'), preview=$('preview');
fCat.innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
$('fWant').innerHTML=[1,2,3,4,5].map(n=>`<label><input type="radio" name="want" value="${n}" ${n===3?'checked':''}><span>${n}</span></label>`).join('');
let photo='', catTouched=false, lastUrl='';

function openForm(){
  form.reset(); photo=''; catTouched=false; lastUrl='';
  setPhoto(''); preview.classList.remove('need'); dlg.classList.remove('dragging');
  fMore.classList.remove('on'); fStatus.textContent='';
  dlg.showModal(); fUrl.focus();
}
dlg.querySelector('[data-close]').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

/* --- категория по словам из названия --- */
const CAT_WORDS={
  'сумки и обувь':/сумк|рюкзак|шоппер|клатч|кошел|кроссов|кед|туфл|ботин|сапог|лофер|босонож|сандал|балетк|мюл|обув|bag|shoe|sneaker|boot/i,
  'красота':/крем|сыворот|парфюм|дух|туалетн|помад|тушь|тени|румян|пудр|шампун|маск|бальзам|тоник|скраб|лосьон|уход|аромат|beauty|serum|cream|perfume/i,
  'дом':/тарел|чашк|кружк|пиал|ваз|свеч|плед|подушк|постел|полотен|посуд|бокал|стакан|ковр|ламп|светил|постер|декор|home/i,
  'аксессуары':/серьг|кольц|браслет|колье|цепоч|подвес|час[ыо]|очки|ремен|пояс|платок|шарф|шапк|перчат|заколк|наушник|чехол|jewel|watch/i,
  'одежда':/плать|рубаш|футбол|брюк|джинс|юбк|пальт|куртк|жакет|пиджак|свитер|джемпер|кардиган|топ|костюм|худи|свитшот|блуз|жилет|тренч|шорт|лонгслив|водолаз|dress|shirt|coat|jacket/i,
};
const guessCat=t=>{for(const c in CAT_WORDS) if(CAT_WORDS[c].test(t)) return c; return null};
fCat.addEventListener('change',()=>catTouched=true);
fTitle.addEventListener('input',()=>{if(catTouched) return; const c=guessCat(fTitle.value); if(c) fCat.value=c});

/* --- подтянуть фото, название и цену по ссылке ---
   Браузер сам не может читать чужие сайты, поэтому нужен маленький помощник на сервере:
   GET /api/preview?url=… → {title, price, image}. Работает, когда сайт лежит на хостинге. */
const PREVIEW_API='/api/preview';
const fetchMeta=url=>api(`${PREVIEW_API}?url=${encodeURIComponent(url)}`);
function setPhoto(src){
  photo=src||'';
  preview.style.backgroundImage=photo?`url("${photo.replace(/"/g,'')}")`:'';
  preview.classList.toggle('has',!!photo);
  if(photo) preview.classList.remove('need');
}

async function onUrl(){
  const url=fUrl.value.trim();
  if(!/^https?:\/\/\S+\.\S+/.test(url) || url===lastUrl) return;
  lastUrl=url;
  fMore.classList.add('on');
  const shop=shopName(url);
  fStatus.textContent=`Смотрю, что там на ${shop||'сайте'}…`;
  try{
    const m=await fetchMeta(url);
    if(url!==fUrl.value.trim()) return;
    if(m.title && !fTitle.value) fTitle.value=m.title;
    if(m.price && !fPrice.value) fPrice.value=Math.round(m.price);
    if(m.image && !photo) setPhoto(m.image);
    if(!catTouched){const c=guessCat(m.title||''); if(c) fCat.value=c}
    fStatus.textContent='Подтянула, что нашла — проверь и поправь, если нужно.';
  }catch(err){
    fStatus.textContent=err.status===401
      ? 'Нужно войти заново.'
      : `${shop||'Магазин'} не даёт прочитать страницу — сделай скриншот товара и вставь его ⌘V, а название и цену впиши сама.`;
  }
  if(!photo) preview.classList.add('need');
  fTitle.focus();
}
fUrl.addEventListener('paste',()=>setTimeout(onUrl,0));
fUrl.addEventListener('change',onUrl);
fUrl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!fMore.classList.contains('on')){e.preventDefault();onUrl()}});

// своё фото уменьшаем до 900px, чтобы влезло в память браузера
function fileToPhoto(f){
  if(!f || !/^image\//.test(f.type)) return;
  const img=new Image();
  img.onload=()=>{
    const k=Math.min(1,900/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    setPhoto(c.toDataURL('image/jpeg',.82));
    fMore.classList.add('on');
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);
}
fFile.addEventListener('change',()=>{fileToPhoto(fFile.files[0]); fFile.value=''});

// скриншот из буфера: ⌘V в любом месте формы
dlg.addEventListener('paste',e=>{
  const item=[...(e.clipboardData?.items||[])].find(i=>i.kind==='file'&&i.type.startsWith('image/'));
  if(!item) return;            // обычный текст (ссылку) вставляем как обычно
  e.preventDefault();
  fileToPhoto(item.getAsFile());
});
// картинку можно перетащить в окно
dlg.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();dlg.classList.add('dragging')}});
dlg.addEventListener('dragleave',e=>{if(e.target===dlg||!dlg.contains(e.relatedTarget)) dlg.classList.remove('dragging')});
dlg.addEventListener('drop',e=>{
  dlg.classList.remove('dragging');
  const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/'));
  if(f){e.preventDefault();fileToPhoto(f)}
});

form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!fMore.classList.contains('on')){onUrl();return}
  const btn=form.querySelector('.submit'); btn.disabled=true; btn.textContent='Сохраняю…';
  try{
    await api('/api/items',{method:'POST',body:JSON.stringify({
      title:fTitle.value.trim(),
      price:+fPrice.value||0,
      cat:fCat.value,
      url:fUrl.value.trim(),
      want:+form.querySelector('input[name=want]:checked').value,
      img:photo,
    })});
    dlg.close();
    state.sort='new'; document.querySelectorAll('[data-sort]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.sort==='new'));
    await loadItems();
  }catch(err){
    fStatus.innerHTML=`<span class="err">${esc(err.status===401?'Нужно войти заново.':err.message)}</span>`;
  }finally{
    btn.disabled=false; btn.textContent='Добавить в виш-лист';
  }
});

/* ===== вход / выход ===== */
const loginDlg=$('loginDlg'), loginForm=$('loginForm'), lPass=$('lPass'), lStatus=$('lStatus');
$('loginBtn').onclick=async()=>{
  if(owner){ await api('/api/logout',{method:'POST'}).catch(()=>{}); return loadItems(); }
  loginForm.reset(); lStatus.textContent=''; loginDlg.showModal(); lPass.focus();
};
loginDlg.querySelector('[data-close-login]').onclick=()=>loginDlg.close();
loginDlg.addEventListener('click',e=>{if(e.target===loginDlg)loginDlg.close()});
loginForm.addEventListener('submit',async e=>{
  e.preventDefault();
  try{
    await api('/api/login',{method:'POST',body:JSON.stringify({password:lPass.value})});
    loginDlg.close(); await loadItems();
  }catch(err){
    lStatus.innerHTML=`<span class="err">${esc(err.message)}</span>`; lPass.select();
  }
});

loadItems();
</script>
</body>
</html>
